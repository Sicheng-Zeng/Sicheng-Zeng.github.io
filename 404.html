<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 · 曾思诚</title>
<meta name="description" content="页面不存在，返回曾思诚的个人主页。">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px var(--gutter);
    text-align: center;
  }
  .nf-code {
    font-family: var(--font-serif);
    font-size: clamp(64px, 14vw, 132px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--line-strong);
  }
  .nf-title { font-size: clamp(20px, 3vw, 26px); font-weight: 500; }
  .nf-desc { color: var(--muted); font-size: 14px; max-width: 30em; }
  .nf-link {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    font-size: 14px;
    transition: background 0.25s var(--ease), color 0.25s var(--ease);
  }
  .nf-link:hover { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<main class="nf">
  <p class="nf-code">404</p>
  <h1 class="nf-title">这个页面不在了</h1>
  <p class="nf-desc">可能是链接拼写有误，或者页面已经调整。回到首页继续浏览吧。</p>
  <a class="nf-link" href="/home.html">返回首页 <span aria-hidden="true">↗</span></a>
</main>
</body>
</html>
